name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install pytest pytest-asyncio httpx pyyaml
          pip install -e . --no-deps || pip install -e ".[dev]" --no-deps
      - name: Test
        run: pytest -q
        env:
          # Holix is optional for unit tests of providers/config
          PYTHONPATH: .
