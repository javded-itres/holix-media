[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "holix-media"
version = "0.1.0"
description = "Holix extension: generate images and video via pluggable models, send to Telegram/MAX"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Pavel Lukyanov" }]
keywords = ["holix", "extension", "image", "video", "telegram", "max"]
dependencies = [
    "Holix>=1.1.0",
    "holix-sdk>=0.1.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.urls]
Homepage = "https://github.com/javded-itres/holix-media"
Source = "https://github.com/javded-itres/holix-media"
Issues = "https://github.com/javded-itres/holix-media/issues"

[project.entry-points."holix.extensions"]
media = "holix_media.extension:get_extension"

[project.entry-points."holix.agent.extensions"]
media = "holix_media.agent:get_agent_extension"

[tool.hatch.build.targets.wheel]
packages = ["holix_media"]

[tool.hatch.build.targets.wheel.force-include]
"holix_media/skill" = "holix_media/skill"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
